<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Medimate AI - Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&family=Kanit:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root{
      --bg: #f1f5fa;
      --panel: #ffffff;
      --line: rgba(120,170,210,.22);
      --text: #17324a;

      --brand1:#1aa9d6;
      --brand2:#17b8a3;
      --brand3:#0f8fc7;
      --brand4:#14a89a;

      --userGrad1:#d1e9ff;
      --userGrad2:#7eddf7;

      --shadow: 0 12px 38px rgba(31, 124, 184, .10);
      --shadow2: 0 8px 24px rgba(31, 124, 184, .08);
    }

    html {
      /* เพิ่มขนาดตัวอักษรพื้นฐานทั้งเว็บ (จาก 16px เป็น 19px) เพื่อให้อ่านง่ายขึ้นสำหรับผู้สูงอายุ */
      font-size: 19px;
    }
    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', 'Kanit', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      line-height: 1.5;
    }
    /* ให้เห็นกรอบโฟกัสชัดเจนเวลากดคีย์บอร์ด/แป้น Tab */
    a:focus-visible, button:focus-visible, textarea:focus-visible {
      outline: 3px solid #ff9800;
      outline-offset: 3px;
    }

    /* ===== Topbar (desktop/iPad) ===== */
    .topbar {
      width: 100%;
      height: 84px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      box-sizing: border-box;
      box-shadow: 0 2px 14px rgba(80,150,200,0.09);
      border-radius: 0 0 18px 18px;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .logo-group { display: flex; align-items: center; gap: 10px; }
    .logo-img { height: 78px; width: auto; object-fit: contain; }
    .topbar-actions { display: flex; align-items: center; gap: 16px; }

    .home-btn, .profile-btn {
      background: linear-gradient(90deg, var(--brand1) 0%, var(--brand2) 100%);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 58px; height: 58px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem;
      cursor: pointer;
      box-shadow: 0 1.5px 7px rgba(0,179,179,.20);
      transition: transform .12s, filter .12s;
      position: relative;
      overflow: hidden;
    }
    .profile-btn { background: linear-gradient(90deg, var(--brand3) 0%, var(--brand4) 100%); }
    .home-btn:hover, .profile-btn:hover { transform: scale(1.06); filter: saturate(1.05); }
    .home-btn:active, .profile-btn:active { transform: scale(0.96); }

    /* ===== Layout ===== */
    .main-content{
      width: 100%;
      min-height: calc(100vh - 84px);
      display: flex;
      align-items: stretch;
      justify-content: center;
      margin: 0 auto;
    }

    /* Sidebar (desktop/iPad) */
    .sidebar{
      width: 290px;
      min-width: 170px;
      background: linear-gradient(180deg, #eaf7fd 0%, #f7fbff 100%);
      border-right: 1px solid rgba(160,220,255,.45);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 22px 0 0 0;
    }
    .sidebar-title{
      font-size: 1.25rem;
      font-weight: 800;
      color: #0a5a94;
      margin: 0 0 8px 22px;
      display: flex; align-items: center; gap: 8px;
    }
    .new-chat-btn{
      background: linear-gradient(90deg, #1aa9d6 0%, #17b8a3 100%);
      color: #fff;
      border: none;
      border-radius: 16px;
      margin: 0 18px 0 18px;
      padding: 15px 0;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s, filter .12s;
      box-shadow: 0 10px 22px rgba(82, 212, 228, .18);
      display: flex; align-items: center; justify-content: center; gap: 9px;
      position: relative;
      overflow: hidden;
    }
    .new-chat-btn:hover{ transform: translateY(-1px); filter: saturate(1.06); }
    .new-chat-btn:active{ transform: scale(.98); }

    .sidebar-list{
      list-style: none;
      padding: 0 14px 14px 14px;
      margin: 0;
      flex: 1;
      overflow: auto;
    }
    .sidebar-list li{
      padding: 14px 12px;
      font-size: 1.12rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 12px;
      margin-bottom: 8px;
      transition: transform .12s, background .14s, color .13s;
      display: flex; align-items: center; gap: 8px;
      background: #fff;
      color: #0a4d78;
      box-shadow: 0 8px 18px rgba(145, 216, 248, .22);
      animation: fade-in .25s ease both;
    }
    .sidebar-list li.active, .sidebar-list li:hover{
      background: linear-gradient(90deg, #bef1ff 0%, #def6fb 100%);
      color: #0a5a94;
      transform: translateY(-1px);
    }
    .sidebar-list .delete-chat-btn{
      margin-left: auto;
      background: #fff0f0;
      border: 1px solid rgba(255, 180, 180, .6);
      color: #eb3030;
      font-size: 1.1rem;
      cursor: pointer;
      border-radius: 999px;
      padding: 8px 12px;
      transition: transform .12s, background .12s, color .12s;
    }
    .sidebar-list .delete-chat-btn:hover{
      background: #ffd4d4;
      color: #a30d0d;
      transform: scale(1.05);
    }

    @keyframes fade-in{
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== Main chat ===== */
    .main-chat{
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: radial-gradient(1200px 400px at 50% 0%, rgba(52,192,235,.10), transparent 60%),
                  linear-gradient(180deg, #f8fbff 0%, #f4f8fd 100%);
      position: relative;
      overflow: hidden;
    }

    .chat-messages{
      flex: 1;
      overflow-y: auto;
      padding: 18px 18px 120px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: 1.18rem;
      scroll-behavior: smooth;
    }

    .message{
      max-width: 78%;
      padding: 16px 18px;
      border-radius: 18px;
      background: #fff;
      color: #17324a;
      align-self: flex-start;
      box-shadow: 0 10px 20px rgba(15, 80, 120, .06);
      word-break: break-word;
      animation: fade-in .22s ease both;
      border: 1px solid rgba(170, 220, 255, .35);
      line-height: 1.6;
    }
    .message.user{
      align-self: flex-end;
      background: linear-gradient(90deg, var(--userGrad1) 10%, var(--userGrad2) 100%);
      color: #0a3f56;
      border-bottom-right-radius: 10px;
      border: 1px solid rgba(80, 190, 240, .25);
    }
    .message.bot{
      align-self: flex-start;
      background: #ffffffcc;
      backdrop-filter: blur(6px);
      color: #0a5a78;
      border-bottom-left-radius: 10px;
    }
    .message.loading{ opacity: .7; font-style: italic; }

    /* ===== Input ===== */
    .chat-input-area{
      width: 100%;
      position: absolute;
      bottom: 0; left: 0;
      padding: 16px 0 18px 0;
      display: flex;
      justify-content: center;
      z-index: 5;
      background: linear-gradient(180deg, rgba(248,251,253,0) 0%, rgba(248,251,253,.92) 26%, rgba(248,251,253,1) 100%);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(160,220,255,.35);
    }
    .chat-input-box{
      width: min(860px, 92vw);
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: rgba(255,255,255,.98);
      border-radius: 18px;
      box-shadow: var(--shadow2);
      padding: 12px 12px 12px 16px;
      border: 1.6px solid rgba(170, 220, 255, .55);
    }
    .chat-input{
      flex: 1;
      border: none;
      outline: none;
      font-size: 1.18rem;
      background: transparent;
      color: #0a3f56;
      font-family: inherit;
      letter-spacing: 0.01em;
      resize: none;
      line-height: 1.5;
      min-height: 48px;
      max-height: 150px;
      padding: 12px 8px 12px 6px;
      overflow-y: auto;
    }
    .icon-btn{
      background: linear-gradient(90deg, #2edcff 0%, #45d4d6 100%);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1.5rem;
      width: 56px; height: 56px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 20px rgba(65,189,245,.20);
      transition: transform .12s, filter .12s;
      outline: none;
      position: relative;
      overflow: hidden;
    }
    .icon-btn:hover{ transform: translateY(-1px); filter:saturate(1.06); }
    .icon-btn:active{ transform: scale(.97); }
    .chat-mic-btn.active{
      color: #ef5151;
      background: #ffeaea;
      box-shadow: 0 10px 20px rgba(239, 81, 81, .14);
      border: 1px solid rgba(255, 160, 160, .6);
    }

    /* ===== Ripple ===== */
    .ripple{
      position: absolute;
      border-radius: 999px;
      transform: scale(0);
      animation: ripple 520ms ease-out;
      background: rgba(0, 150, 199, 0.22);
      pointer-events: none;
    }
    @keyframes ripple{ to { transform: scale(3.2); opacity: 0; } }

    /* ===== Toast (บอกว่าปัดเพื่อสร้างแชท) ===== */
    .toast{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 100px;
      background: rgba(17, 24, 39, .90);
      color: #fff;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 600;
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s, transform .18s;
      box-shadow: 0 10px 22px rgba(0,0,0,.18);
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    /* ===== Responsive ===== */
    @media (max-width: 950px){
      .sidebar{ width: 120px; min-width: 0; }
      .sidebar-title{ font-size: 1rem; margin-left: 12px; }
      .new-chat-btn{ margin: 0 10px; font-size: 1.02rem; border-radius: 14px; }
      .sidebar-list{ padding: 0 10px 12px 10px; }
      .sidebar-list li{ font-size: 1rem; padding: 12px 10px; }
      .logo-img{ height: 56px; }
      .topbar{ padding: 0 14px; }
      .message{ max-width: 86%; }
    }

    /* ✅ มือถือ: Topbar ให้เหมือนหน้าอื่นในชุดเดียวกัน */
    @media (max-width: 650px){
      .sidebar{ display: none; }
      .main-content{ padding: 0; }

      .topbar{
        height: 66px;
        padding: 0 3.5vw;            /* ซ้ายขวาห่างเท่ากัน */
        border-radius: 0 0 18px 18px; /* เหมือนสไตล์หน้าอื่น */
        box-shadow: 0 2px 14px rgba(80,150,200,0.10);
      }
      .logo-img{ height: 56px; }
      .home-btn, .profile-btn{
        width: 48px; height: 48px;
        font-size: 1.3rem;
      }

      .chat-messages{
        padding: 14px 3.5vw 120px 3.5vw; /* ซ้ายขวาห่างเท่ากัน */
        gap: 12px;
        font-size: 1.1rem;
      }
      .message{
        max-width: 92%;
        padding: 14px 15px;
        border-radius: 16px;
      }
      .chat-input-area{ padding: 14px 0 16px; }
      .chat-input-box{
        width: 92vw;                 /* ซ้ายขวาห่างเท่ากัน */
        border-radius: 18px;
        padding: 10px 10px 10px 14px;
        gap: 8px;
      }
      .chat-input{ font-size: 1.08rem; min-height: 44px; }
      .icon-btn{ width: 50px; height: 50px; border-radius: 14px; font-size: 1.35rem; }
    }
  </style>
</head>

<body>
  <!-- Topbar -->
  <div class="topbar">
    <div class="logo-group">
      <img src="images/MedimateAI.png" alt="Medimate Logo" class="logo-img">
    </div>
    <div class="topbar-actions">
      <button class="home-btn tap-btn" onclick="window.location.href='main.html'" title="Home">
        <i class="fa-solid fa-house"></i>
      </button>
      <button class="profile-btn tap-btn" title="โปรไฟล์" onclick="window.location.href='profile.html'">
        <i class="fa-solid fa-user"></i>
      </button>
    </div>
  </div>

  <!-- Chat Layout -->
  <div class="main-content">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-title"><i class="fa-solid fa-comments"></i> แชทบอท</div>
      <button class="new-chat-btn tap-btn" onclick="createNewChat(true)">
        <i class="fa-solid fa-plus"></i> New Chat
      </button>
      <ul class="sidebar-list" id="chatHistoryList"></ul>
    </div>

    <!-- Main Chat -->
    <div class="main-chat" id="mainChatArea">
      <div class="chat-messages" id="chatMessages"></div>

      <form class="chat-input-area" id="chatForm" autocomplete="off">
        <div class="chat-input-box">
          <textarea id="chatInput" class="chat-input" placeholder="พิมพ์ข้อความที่นี่..." required autocomplete="off" rows="1"></textarea>

          <button type="button" id="micBtn" class="icon-btn chat-mic-btn tap-btn" title="พูดคุยด้วยเสียง">
            <i class="fa-solid fa-microphone"></i>
          </button>

          <button class="icon-btn chat-send-btn tap-btn" type="submit" title="ส่งข้อความ">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast">สร้างแชทใหม่แล้ว ✅</div>

  <script>
    // === CHATBOT FUNCTION ===
    // ใช้ Hugging Face Inference (endpoint เข้ากันได้กับรูปแบบ OpenAI chat completions)
    // อย่า hardcode token ในไฟล์นี้ — ใครเปิดหน้าเว็บก็กด View Source อ่านได้
    // ตั้งค่าครั้งเดียวใน console ของเบราว์เซอร์:
    //   localStorage.setItem("medimate_hf_token", "hf_...")
    //   localStorage.setItem("medimate_hf_model", "ชื่อโมเดลที่จะใช้")   // ไม่ตั้งก็ได้
    const HF_TOKEN    = localStorage.getItem("medimate_hf_token") || "";
    const HF_MODEL    = localStorage.getItem("medimate_hf_model") || "meta-llama/Llama-3.3-70B-Instruct";
    const HF_ENDPOINT = localStorage.getItem("medimate_hf_endpoint") || "https://router.huggingface.co/v1/chat/completions";
    const systemPrompt = "คุณคือผู้ช่วยสุขภาพแบบเป็นมิตรและใจดี ใช้ภาษาไทยเป็นหลัก ช่วยตอบทุกเรื่องสุขภาพ ยา เบื้องต้นในแบบฉบับ MedimateAI";

    const chatMessages = document.getElementById('chatMessages');
    const chatHistoryList = document.getElementById('chatHistoryList');
    const chatInputEl = document.getElementById('chatInput');
    const mainChatArea = document.getElementById('mainChatArea');
    const toastEl = document.getElementById('toast');

    let chatHistories = JSON.parse(localStorage.getItem("medimate_chat_histories") || "[]");
    let currentChatIndex = 0;

    if (chatHistories.length === 0) {
      chatHistories = [{title: "แชทล่าสุด", messages: []}];
    }

    let waitingForFirstMsg = false;

    function showToast(text){
      toastEl.textContent = text || "สำเร็จ ✅";
      toastEl.classList.add("show");
      setTimeout(()=> toastEl.classList.remove("show"), 1200);
    }

    function renderChatHistory() {
      chatHistoryList.innerHTML = "";
      chatHistories.forEach((c, idx) => {
        const li = document.createElement("li");
        li.className = idx === currentChatIndex ? "active" : "";
        li.innerHTML = `<i class="fa-solid fa-comment-dots"></i> ${c.title}
          <button class="delete-chat-btn" title="ลบแชทนี้" onclick="event.stopPropagation();deleteChat(${idx})">
            <i class="fa-solid fa-trash"></i>
          </button>`;
        li.onclick = () => { saveCurrentChat(); currentChatIndex = idx; renderChatHistory(); renderChat(); };
        chatHistoryList.appendChild(li);
      });
    }

    function renderChat() {
      chatMessages.innerHTML = "";
      const curr = chatHistories[currentChatIndex];
      if (!curr.messages || curr.messages.length === 0) {
        addMessage("สวัสดีค่ะ! หนูคือผู้ช่วยสุขภาพ Medimate AI ถามได้ทุกเรื่องเกี่ยวกับสุขภาพและยา", "bot", false, true);
        return;
      }
      curr.messages.forEach(m => addMessage(m.text, m.sender, false, true));
      scrollToBottom();
    }

    function scrollToBottom(){
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addMessage(text, sender, isLoading=false, silent=false) {
      const div = document.createElement('div');
      div.className = "message " + sender + (isLoading ? " loading" : "");
      div.textContent = text;
      chatMessages.appendChild(div);
      scrollToBottom();

      if (!silent) {
        const curr = chatHistories[currentChatIndex];
        curr.messages = curr.messages || [];
        curr.messages.push({text, sender});
        saveCurrentChat();
      }
      return div;
    }

    function saveCurrentChat() {
      localStorage.setItem("medimate_chat_histories", JSON.stringify(chatHistories));
    }

    // ✅ createNewChat(showToastOnMobile)
    function createNewChat(showToastOnMobile=false) {
      chatHistories.unshift({title: "กำลังรอ...", messages: []});
      currentChatIndex = 0;
      waitingForFirstMsg = true;
      renderChatHistory();
      renderChat();
      saveCurrentChat();
      chatInputEl.focus();

      if (showToastOnMobile && window.matchMedia("(max-width: 650px)").matches){
        showToast("เพิ่มหน้าแชทใหม่แล้ว ✅");
      }
    }

    function deleteChat(idx) {
      if (chatHistories.length <= 1) { alert("ต้องมีอย่างน้อย 1 แชท"); return; }
      if (confirm("ต้องการลบแชทนี้ใช่หรือไม่?")) {
        chatHistories.splice(idx, 1);
        if (currentChatIndex >= chatHistories.length) currentChatIndex = chatHistories.length - 1;
        renderChatHistory();
        renderChat();
        saveCurrentChat();
      }
    }

    // ===== Auto-grow textarea =====
    function autoGrow(el){
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 140) + "px";
    }
    chatInputEl.addEventListener('input', () => autoGrow(chatInputEl));

    // ===== Ripple / tap feedback =====
    function addRipple(el, x, y) {
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.width = ripple.style.height = size + "px";
      ripple.style.left = (x - rect.left - size / 2) + "px";
      ripple.style.top  = (y - rect.top  - size / 2) + "px";
      el.appendChild(ripple);
      setTimeout(() => ripple.remove(), 560);
    }
    document.querySelectorAll(".tap-btn").forEach(el => {
      el.addEventListener("pointerdown", (e) => {
        const isTouchLike = e.pointerType === "touch" || e.pointerType === "pen";
        if (!isTouchLike) return;
        addRipple(el, e.clientX, e.clientY);
      });
    });

    // ===== TTS Thai =====
    function speakTH(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "th-TH";
      utter.pitch = 1.00;
      utter.rate = 1.00;

      let voices = window.speechSynthesis.getVoices();
      let maleVoice = voices.find(
        v => v.lang === "th-TH" && (
          v.name.toLowerCase().includes("male") ||
          v.name.includes("ชาย") ||
          v.name.includes("Nattawat") ||
          v.name.includes("Pattara") ||
          v.name.toLowerCase().includes("nattawat") ||
          v.name.toLowerCase().includes("pattara")
        )
      );
      if (!maleVoice) maleVoice = voices.find(v => v.lang === "th-TH");
      if (maleVoice) utter.voice = maleVoice;
      window.speechSynthesis.speak(utter);
    }
    if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = () => {};

    // ===== Send to OpenAI =====
    async function sendToAI(message) {
      const curr = chatHistories[currentChatIndex];
      curr.messages = curr.messages || [];

      const messages = [
        {role: "system", content: systemPrompt},
        ...curr.messages.map(m => ({
          role: m.sender === "user" ? "user" : "assistant",
          content: m.text
        })),
        {role: "user", content: message}
      ];

      const loadingDiv = addMessage("กำลังคิดคำตอบ...", "bot", true);

      if (!HF_TOKEN) {
        loadingDiv.remove();
        addMessage('ยังไม่ได้ตั้งค่า token ของ Hugging Face — เปิด console แล้วสั่ง localStorage.setItem("medimate_hf_token", "hf_...")', "bot");
        return;
      }

      try {
        const response = await fetch(HF_ENDPOINT, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + HF_TOKEN
          },
          body: JSON.stringify({
            model: HF_MODEL,
            messages: messages,
            max_tokens: 600,
            temperature: 0.6
          })
        });

        const data = await response.json();
        let reply = "ขออภัย ระบบไม่สามารถตอบได้ชั่วคราวครับ";

        if (data.choices && data.choices.length > 0) reply = data.choices[0].message.content.trim();
        else if (data.error && data.error.message) reply = "ขออภัย: " + data.error.message;

        loadingDiv.remove();
        addMessage(reply, "bot");
        speakTH(reply);
        saveCurrentChat();
      } catch (err) {
        loadingDiv.remove();
        addMessage("ขออภัย มีปัญหาในการเชื่อมต่อเซิร์ฟเวอร์", "bot");
      }
    }

    // ===== Handle Send =====
    document.getElementById('chatForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const msg = chatInputEl.value.trim();
      if (!msg) return;

      addMessage(msg, "user");

      if (waitingForFirstMsg) {
        chatHistories[currentChatIndex].title = msg.length > 26 ? msg.substring(0, 26) + "..." : msg;
        waitingForFirstMsg = false;
        renderChatHistory();
        saveCurrentChat();
      }

      chatInputEl.value = "";
      autoGrow(chatInputEl);
      sendToAI(msg);
      saveCurrentChat();
    });

    // Enter ส่ง / Shift+Enter ขึ้นบรรทัดใหม่
    chatInputEl.addEventListener('keydown', (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('chatForm').requestSubmit();
      }
    });

    // ===== Voice input =====
    let recognizing = false;
    let recognition;
    const micBtn = document.getElementById('micBtn');

    function updateMicUI(active) {
      if (active) {
        micBtn.classList.add("active");
        micBtn.title = "หยุดฟังเสียง";
      } else {
        micBtn.classList.remove("active");
        micBtn.title = "กดเพื่อพูด";
      }
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = "th-TH";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => { recognizing = true; updateMicUI(true); }
      recognition.onend = () => { recognizing = false; updateMicUI(false); }
      recognition.onerror = (e) => {
        recognizing = false; updateMicUI(false);
        alert("เกิดปัญหา: " + (e.error || "ไม่สามารถฟังเสียงได้"));
      };
      recognition.onresult = (event) => {
        const result = event.results[0][0].transcript;
        chatInputEl.value = result;
        autoGrow(chatInputEl);
        document.getElementById('chatForm').requestSubmit();
      };

      micBtn.addEventListener('click', () => {
        if (recognizing) recognition.stop();
        else recognition.start();
      });
    } else {
      micBtn.disabled = true;
      micBtn.title = "เบราว์เซอร์ไม่รองรับ Voice (แนะนำ Chrome หรือ Edge)";
      micBtn.style.opacity = 0.6;
      micBtn.innerHTML = '<i class="fa-solid fa-microphone-slash"></i>';
    }

    /* =========================================================
       ✅ ปัดขวา = เพิ่มหน้าแชทใหม่ (เฉพาะมือถือ)
       - ปัดจากขอบซ้าย (ภายใน 24px) กันชนกับการเลื่อนในหน้าจอ
       - ต้องปัดขวาไกลพอ + แนวนอนไปทางขวาชัดเจน
       ========================================================= */
    let sx = 0, sy = 0, tracking = false;
    const EDGE = 24;         // ต้องเริ่มจากขอบซ้าย
    const DIST = 70;         // ระยะปัด
    const V_TOL = 55;        // อนุญาตแนวตั้งได้แค่นี้

    mainChatArea.addEventListener("touchstart", (e) => {
      if (!window.matchMedia("(max-width: 650px)").matches) return;
      if (!e.touches || e.touches.length !== 1) return;

      const t = e.touches[0];
      sx = t.clientX;
      sy = t.clientY;
      tracking = (sx <= EDGE); // ต้องเริ่มจากขอบซ้าย
    }, {passive: true});

    mainChatArea.addEventListener("touchmove", (e) => {
      if (!tracking) return;
      // ไม่ preventDefault เพื่อให้ยังเลื่อนแชทได้ตามปกติ
    }, {passive: true});

    mainChatArea.addEventListener("touchend", (e) => {
      if (!tracking) return;
      tracking = false;

      const t = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : null;
      if (!t) return;

      const dx = t.clientX - sx;
      const dy = t.clientY - sy;

      // ต้องปัดขวาไกลพอ และไม่เฉียงขึ้นลงมาก
      if (dx >= DIST && Math.abs(dy) <= V_TOL) {
        createNewChat(true);
      }
    }, {passive: true});

    // ===== Initial Render =====
    renderChatHistory();
    renderChat();
    window.deleteChat = deleteChat;
  </script>
</body>
</html>
