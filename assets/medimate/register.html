<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medimate AI - Register</title>

  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #c2e9fb 0%, #81c7f5 100%);
      padding: 18px;
    }

    /* ===== Card ===== */
    .register-box {
      background: rgba(255,255,255,0.92);
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.75);
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.10);

      width: 100%;
      max-width: 330px;              /* เท่าหน้าแรก / login */
      margin: 20px auto 70px auto;
      padding: 30px 22px 26px 22px;

      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadein .8s ease both;
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(18px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== Avatar ===== */
    .avatar {
      width: 72px;
      height: 72px;
      margin-top: -16px;
      margin-bottom: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #b1e3fc 0%, #ffffff 90%);
      box-shadow: 0 4px 14px rgba(83,183,244,0.13);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1ba6e5;
      font-size: 2rem;
    }

    .register-title {
      font-size: 1.45rem;
      font-weight: 700;
      color: #208bcf;
      margin-bottom: 16px;
      text-align: center;
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-label {
      font-size: 1.02rem;
      font-weight: 700;
      color: #205375;
      margin-left: 6px;
      margin-bottom: 4px;
    }

    .register-input {
      width: 100%;
      padding: 12px 18px;
      font-size: 1.05rem;
      border-radius: 22px;
      border: 2px solid #e0e9f2;
      background: #eaf7fd;
      color: #16445e;
      font-family: inherit;
      outline: none;
      transition: border .18s, background .18s;
    }

    .register-input:focus {
      border-color: #38b6ff;
      background: #ffffff;
    }

    .register-btn {
      margin-top: 6px;
      padding: 12px 0;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg, #00b4d8, #0077b6);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(81,192,228,0.35);
      transition: transform .15s, box-shadow .15s, background .2s;
    }

    .register-btn:hover,
    .register-btn:focus {
      background: linear-gradient(90deg, #0096c7, #023e8a);
      transform: translateY(-1px) scale(1.03);
      box-shadow: 0 8px 24px rgba(96,180,228,0.45);
    }

    .error-msg {
      display: none;
      min-height: 20px;
      margin-top: 8px;
      text-align: center;
      font-size: 0.98rem;
      color: #e14a55;
    }

    .login-link {
      margin-top: 18px;
      font-size: 0.98rem;
      color: #16699c;
      text-align: center;
    }

    .login-link a {
      color: #1d9bd1;
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    /* ===== Footer ===== */
    footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100vw;
      text-align: center;
      font-size: 0.9rem;
      background: #328ec7;
      color: #e8f7ff;
      padding: 5px 0 2px 0;
      letter-spacing: 0.01em;
      box-shadow: 0 -2px 18px #8be7fc33;
    }

    @media (max-width: 520px) {
      .register-box {
        max-width: 330px;
        margin: 10vw auto 80px auto;
        padding: 28px 7vw 18px 7vw;
      }
      .avatar { width: 60px; height: 60px; font-size: 1.6rem; }
      .register-title { font-size: 1.18rem; }
      footer { font-size: 0.82rem; padding: 3px 0 1px 0; }
    }
  </style>
</head>

<body>

  <div class="register-box">
    <div class="avatar">
      <i class="fa-solid fa-user-plus"></i>
    </div>

    <div class="register-title">สมัครสมาชิก</div>

    <form id="registerForm" autocomplete="off">
      <div>
        <label class="input-label" for="fullname">ชื่อ - นามสกุล</label>
        <input class="register-input" type="text" id="fullname" required>
      </div>

      <div>
        <label class="input-label" for="username">Username</label>
        <input class="register-input" type="text" id="username" required>
      </div>

      <div>
        <label class="input-label" for="email">Email</label>
        <input class="register-input" type="email" id="email" required>
      </div>

      <div>
        <label class="input-label" for="password">Password</label>
        <input class="register-input" type="password" id="password" required minlength="6">
      </div>

      <button type="submit" class="register-btn">
        <i class="fas fa-user-plus"></i> สมัครสมาชิก
      </button>

      <div id="errorMsg" class="error-msg"></div>
    </form>

    <div class="login-link">
      มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a>
    </div>
  </div>

  <footer>
    © 2025 Medimate AI — ดูแลด้วยใจ ใส่ใจด้วยเทคโนโลยี
  </footer>

  <script>
    /* ===== Firebase (medimate-end) ===== */
    const firebaseConfig = {
      apiKey: "AIzaSyAM5gSwcz9CWcZFcYW9VPOOckWouXj7Ehw",
      authDomain: "medimate-end.firebaseapp.com",
      projectId: "medimate-end",
      storageBucket: "medimate-end.firebasestorage.app",
      messagingSenderId: "411322830334",
      appId: "1:411322830334:web:c08cdb63ea9fff1a9444af",
      measurementId: "G-CZLM5M88BE"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const form = document.getElementById("registerForm");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";

      const fullname = document.getElementById("fullname").value.trim();
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (password.length < 6) {
        errorMsg.textContent = "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร";
        errorMsg.style.display = "block";
        return;
      }

      if (!/^[a-zA-Z0-9_]+$/.test(username)) {
        errorMsg.textContent = "Username ใช้ได้เฉพาะ a-z, A-Z, 0-9 และ _ เท่านั้น";
        errorMsg.style.display = "block";
        return;
      }

      try {
        // 1) สมัครใน Firebase Auth
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // 2) บันทึกข้อมูลผู้ใช้ใน Firestore
        await db.collection("users").doc(user.uid).set({
          fullname,
          username,
          email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // 3) ชัวร์: logout แล้วไปหน้า login
        await auth.signOut();
        window.location.replace("login.html");

      } catch (err) {
        if (err.code === "auth/email-already-in-use") {
          errorMsg.textContent = "อีเมลนี้ถูกใช้ไปแล้ว";
        } else if (err.code === "auth/invalid-email") {
          errorMsg.textContent = "อีเมลไม่ถูกต้อง";
        } else if (err.code === "auth/weak-password") {
          errorMsg.textContent = "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร";
        } else {
          errorMsg.textContent = "เกิดข้อผิดพลาด: " + (err.message || "ไม่ทราบสาเหตุ");
        }
        errorMsg.style.display = "block";
      }
    });
  </script>

</body>
</html>
