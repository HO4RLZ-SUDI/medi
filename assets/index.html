<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ตู้จ่ายยา — UNO Q</title>
<style>
  :root {
    --bg: #10161a; --panel: #18232a; --line: #2a3b45;
    --fg: #e6edf1; --muted: #8ba3b0; --teal: #00979d; --teal-dim: #007e83;
    --ok: #3ecf8e; --err: #ff6b6b; --warn: #f0b93b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px;
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Noto Sans Thai", sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px; margin-bottom: 18px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 14px; letter-spacing: .3px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .tag { min-width: 92px; font-size: 13px; color: var(--muted); }
  button {
    background: var(--teal); color: #fff; border: 0; border-radius: 6px;
    padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  button:hover { background: var(--teal-dim); }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); }
  button.big { padding: 12px 18px; font-size: 15px; width: 100%; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input[type=range] { flex: 1; min-width: 150px; accent-color: var(--teal); }
  input[type=number] {
    width: 64px; background: #0d1418; color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px;
    font-family: inherit; font-size: 13px;
  }
  .angle { width: 46px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .log {
    font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted);
    border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px; min-height: 18px;
  }
  .log.ok { color: var(--ok); } .log.err { color: var(--err); }
  #view-wrap {
    position: relative; width: 100%; max-width: 640px; aspect-ratio: 4/3;
    border-radius: 8px; overflow: hidden; background: #06090b; border: 1px solid var(--line);
  }
  #view { width: 100%; height: 100%; border: 0; display: block; }
  #view-placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px;
  }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .card { background: #0d1418; border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .card .name { font-size: 15px; font-weight: 600; }
  .card .win { font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
  .card .pills { font-size: 26px; font-variant-numeric: tabular-nums; margin-bottom: 10px; }
  .card .pills small { font-size: 12px; color: var(--muted); font-weight: normal; }
  .card .pills.empty { color: var(--err); }
  .refill { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .refill button { padding: 6px 10px; font-size: 12px; }
  .cfg { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .cfg label { font-size: 12px; color: var(--muted); min-width: 74px; }
  .cfg input[type=range] { flex: 1; min-width: 80px; }
  .cfg .unit { font-size: 12px; color: var(--muted); min-width: 48px; text-align: right;
               font-variant-numeric: tabular-nums; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .stat { background: #0d1418; border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .stat .v { font-size: 20px; margin-top: 4px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ตู้จ่ายยาอัตโนมัติ</h1>
  <div class="sub">สั่งปัดยา • ทดสอบเซอร์โว • กล้อง USB webcam</div>

  <!-- ---------------- สั่งปัดยา ---------------- -->
  <div class="panel">
    <h2>สั่งปัดยา</h2>
    <div class="cards" id="slots"></div>
    <div class="log" id="dispense-log">พร้อม</div>
  </div>

  <!-- ---------------- กล้อง / ตรวจใบหน้า ---------------- -->
  <div class="panel">
    <h2>กล้อง — ตรวจจับใบหน้า</h2>
    <div id="view-wrap">
      <div id="view-placeholder">กำลังรอภาพจากกล้อง...</div>
      <iframe id="view" title="video stream" frameborder="0" style="display:none"></iframe>
    </div>
    <div class="cfg" style="margin-top:12px">
      <label>ความมั่นใจ</label>
      <input type="range" id="conf" min="10" max="95" step="5" value="50" />
      <span class="unit" id="conf-val">0.50</span>
    </div>
    <div class="log" id="cam-log">กำลังเชื่อมต่อ...</div>
  </div>

  <!-- ---------------- เซนเซอร์ ---------------- -->
  <div class="panel">
    <h2>เซนเซอร์บน MCU</h2>
    <div class="grid3">
      <div class="stat"><div class="k">อุณหภูมิ</div><div class="v" id="s-temp">—</div></div>
      <div class="stat"><div class="k">ความชื้น</div><div class="v" id="s-hum">—</div></div>
      <div class="stat"><div class="k">ใบหน้า</div><div class="v" id="s-face">—</div></div>
    </div>
    <div class="log" id="sensor-log">อัปเดตทุก 2 วินาที</div>
  </div>

  <!-- ---------------- ตั้งค่า + ทดสอบเซอร์โว ---------------- -->
  <div class="panel">
    <h2>ตั้งค่าเซอร์โว <span style="color:var(--warn);font-weight:normal">— ทดสอบตรงนี้ไม่นับจำนวนยา</span></h2>
    <div class="cards" id="servos"></div>
    <div class="row" style="margin-top:14px">
      <button class="ghost" id="home-all">กลับตำแหน่งพักทั้งหมด</button>
    </div>
    <div class="log" id="servo-log">พร้อม</div>
  </div>
</div>

<script src="libs/socket.io.min.js"></script>
<script src="libs/arduino.js"></script>
<script>
const ui = new WebUI();
const $ = s => document.querySelector(s);
const log = (el, msg, kind) => { el.textContent = msg; el.className = 'log' + (kind ? ' ' + kind : ''); };

let SLOTS  = [];
let LIMITS = { angle_min: -30, angle_max: 180, speed_max: 1000 };  // ทับด้วยค่าจาก MCU
let SERVOS = [];                                                   // ค่าตั้งรายตัว

/* ---------------- สั่งปัดยา ---------------- */
const dispenseLog = $('#dispense-log');

function renderSlots(pills) {
  const host = $('#slots');
  host.innerHTML = '';
  SLOTS.forEach((s, i) => {
    const n = pills && pills[i] != null ? pills[i] : null;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="name">${s.name}</div>
      <div class="win">${s.window} · ${s.pin}</div>
      <div class="pills ${n === 0 ? 'empty' : ''}" data-pills="${s.idx}">
        ${n == null ? '—' : n}<small> เม็ด</small>
      </div>
      <button class="big" data-act="dispense" data-idx="${s.idx}" ${n === 0 ? 'disabled' : ''}>
        ปัดยามื้อ${s.name}
      </button>
      <div class="refill">
        <input type="number" min="0" max="99" value="5" data-refill="${s.idx}" />
        <button class="ghost" data-act="refill" data-idx="${s.idx}">เติมยา</button>
      </div>
    `;
    host.appendChild(card);
  });
}

$('#slots').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const idx = Number(btn.dataset.idx);
  if (btn.dataset.act === 'dispense') {
    ui.send_message('dispense', { idx });
    log(dispenseLog, 'กำลังสั่งปัดยา...');
  } else {
    const n = Number(document.querySelector(`input[data-refill="${idx}"]`).value);
    ui.send_message('refill', { idx, pills: n });
    log(dispenseLog, 'กำลังเติมยา...');
  }
});

ui.on_message('dispense_status', d => log(dispenseLog, d.message, d.ok ? 'ok' : 'err'));
ui.on_message('pills_update', d => renderSlots(d.pills));

/* ---------------- เซอร์โว ---------------- */
const servoLog = $('#servo-log');

function renderServos() {
  const host = $('#servos');
  host.innerHTML = '';
  SLOTS.forEach((s, i) => {
    const c = SERVOS[i] || { home: 0, push: -30, speed: 120 };
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="name">${s.name}</div>
      <div class="win">${s.pin} · ช่วง ${LIMITS.angle_min}…${LIMITS.angle_max}°</div>

      <div class="cfg">
        <label>ตำแหน่งพัก</label>
        <input type="number" data-f="home" data-idx="${s.idx}"
               min="${LIMITS.angle_min}" max="${LIMITS.angle_max}" value="${c.home}" />
        <span class="unit">°</span>
      </div>
      <div class="cfg">
        <label>ตำแหน่งปัด</label>
        <input type="number" data-f="push" data-idx="${s.idx}"
               min="${LIMITS.angle_min}" max="${LIMITS.angle_max}" value="${c.push}" />
        <span class="unit">°</span>
      </div>
      <div class="cfg">
        <label>ความเร็ว</label>
        <input type="range" data-f="speed" data-idx="${s.idx}"
               min="0" max="600" step="10" value="${c.speed}" />
        <span class="unit spd">${c.speed || 'ทันที'}</span>
      </div>

      <div class="refill">
        <button data-act="save" data-idx="${s.idx}">บันทึก</button>
        <button data-act="servo_pulse" data-idx="${s.idx}" class="ghost">ทดสอบปัด</button>
        <button data-act="servo_sweep" data-idx="${s.idx}" class="ghost">กวาด 3 รอบ</button>
      </div>

      <div class="cfg" style="margin-top:10px">
        <label>สั่งมุมเอง</label>
        <input type="range" data-f="manual" data-idx="${s.idx}"
               min="${LIMITS.angle_min}" max="${LIMITS.angle_max}" value="${c.home}" />
        <span class="unit ang">${c.home}°</span>
      </div>
    `;
    host.appendChild(card);

    // ความเร็ว: อัปเดตป้ายทันที (ยังไม่ส่งจนกว่าจะกดบันทึก)
    const spd = card.querySelector('input[data-f="speed"]');
    spd.addEventListener('input', () => {
      card.querySelector('.spd').textContent = Number(spd.value) ? spd.value + '°/วิ' : 'ทันที';
    });

    // สั่งมุมเอง: ส่งตอนปล่อยนิ้ว — servo_write ฝั่ง MCU บล็อกจนขยับเสร็จ
    const man = card.querySelector('input[data-f="manual"]');
    man.addEventListener('input', () => {
      card.querySelector('.ang').textContent = man.value + '°';
    });
    man.addEventListener('change', () => {
      ui.send_message('servo_write', { idx: s.idx, angle: Number(man.value) });
    });
  });
}

$('#servos').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const idx = Number(btn.dataset.idx);

  if (btn.dataset.act === 'save') {
    const card = btn.closest('.card');
    const val = f => Number(card.querySelector(`input[data-f="${f}"]`).value);
    ui.send_message('set_servo_config', {
      idx, home: val('home'), push: val('push'), speed: val('speed'),
    });
    log(servoLog, 'กำลังบันทึก...');
  } else {
    ui.send_message(btn.dataset.act, { idx });
    log(servoLog, 'กำลังส่งคำสั่ง...');
  }
});

ui.on_message('servo_config_update', d => { SERVOS = d.servos; renderServos(); });

$('#home-all').addEventListener('click', () => ui.send_message('servo_home', {}));
ui.on_message('servo_status', d => log(servoLog, d.message, d.ok ? 'ok' : 'err'));

/* ---------------- กล้อง / ตรวจใบหน้า ---------------- */
async function initCamera() {
  const camLog = $('#cam-log');
  const frame = $('#view');
  const holder = $('#view-placeholder');
  try {
    const r = await (await fetch('/api/cam/status')).json();
    if (!r.ok) { log(camLog, r.error || 'ตัวตรวจใบหน้าไม่พร้อม', 'err'); return; }

    // brick เสิร์ฟภาพที่พอร์ตของตัวเอง ไม่ใช่พอร์ตเดียวกับหน้านี้
    const url = `http://${location.hostname}:${r.port}${r.path}`;
    frame.onload = () => {
      clearInterval(retry);
      holder.style.display = 'none';
      frame.style.display = 'block';
      log(camLog, 'สตรีมจาก ' + url, 'ok');
    };
    // brick ใช้เวลาโหลดโมเดลสักพัก ลองซ้ำจนกว่าจะติด
    const retry = setInterval(() => { frame.src = url; }, 1500);
    frame.src = url;
    log(camLog, 'กำลังรอ brick ตรวจใบหน้าเริ่มทำงาน...');
  } catch (e) {
    log(camLog, 'เช็คสถานะกล้องไม่สำเร็จ: ' + e, 'err');
  }
}

$('#conf').addEventListener('input', () => {
  $('#conf-val').textContent = ($('#conf').value / 100).toFixed(2);
});
$('#conf').addEventListener('change', () => {
  ui.send_message('set_confidence', { confidence: Number($('#conf').value) / 100 });
});

ui.on_message('cam_status', d => {
  log($('#cam-log'), d.ok ? `ปรับความมั่นใจเป็น ${d.confidence}` : d.error, d.ok ? 'ok' : 'err');
});

// อัปเดตช่องใบหน้าแบบเรียลไทม์ ไม่ต้องรอ poll 2 วินาที
ui.on_message('face_update', d => {
  $('#s-face').textContent = d.face ? 'พบ' : 'ไม่พบ';
});

/* ---------------- เซนเซอร์ ---------------- */
async function pollSensors() {
  try {
    const r = await (await fetch('/api/sensors')).json();
    $('#s-temp').textContent = r.temperature == null ? '—' : r.temperature.toFixed(1) + ' °C';
    $('#s-hum').textContent  = r.humidity    == null ? '—' : r.humidity.toFixed(1) + ' %';
    $('#s-face').textContent = r.face == null ? '—' : (r.face ? 'พบ' : 'ไม่พบ');
    if (r.pills) renderSlots(r.pills);
    log($('#sensor-log'), r.errors ? r.errors.join(' | ') : 'อัปเดตทุก 2 วินาที', r.errors ? 'err' : '');
  } catch (e) {
    log($('#sensor-log'), 'อ่านเซนเซอร์ไม่สำเร็จ: ' + e, 'err');
  }
}

/* ---------------- เริ่มต้น ---------------- */
(async () => {
  try {
    const r = await (await fetch('/api/slots')).json();
    SLOTS = r.slots;
    if (r.limits) LIMITS = r.limits;
    if (r.servos) SERVOS = r.servos;
    renderSlots(r.pills);
    renderServos();
  } catch (e) {
    log(dispenseLog, 'โหลดรายการช่องยาไม่สำเร็จ: ' + e, 'err');
  }
  initCamera();
  pollSensors();
  setInterval(pollSensors, 2000);
})();
</script>
</body>
</html>
